<svg xmlns="http://www.w3.org/2000/svg" width="595.28" height="841.89" style="background:#fafaf4"><text x="85" y="58" font-size="15" font-family="Arial" font-weight="700" fill="#214233">Hundetimer</text><text x="48" y="119" font-size="27" font-family="Arial" font-weight="700" fill="#214233">Treneravtale</text><text x="48" y="168.5" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Versjon 1.0</text><text x="48" y="189.5" font-size="11" font-family="Arial" font-weight="700" fill="#214233">Trener: Ærlige Østgårds hundetrening ?</text><text x="48" y="212" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Signert av begge parter</text><text x="48" y="245" font-size="12" font-family="Arial" font-weight="700" fill="#214233">HUNDETIMER - TRENERAVTALE</text><text x="48" y="272" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Versjon 1.0</text><text x="48" y="290" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Gjelder fra 1. oktober 2026</text><text x="48" y="308" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Plattformoperatør: Hundetimer</text><text x="48" y="332" font-size="12" font-family="Arial" font-weight="700" fill="#214233">1. Parter og avtalen</text><text x="48" y="359" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Denne treneravtalen inngås mellom Hundetimer (&quot;Hundetimer&quot;) og virksomheten eller personen som registrerer</text><text x="48" y="374" font-size="10" font-family="Arial" font-weight="400" fill="#214233">og driver trenerprofilen (&quot;Treneren&quot;).</text><text x="48" y="392" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Avtalen regulerer Trenerens bruk av Hundetimer som markedsplass, bookingverktøy, kursplattform, kundeverktøy</text><text x="48" y="407" font-size="10" font-family="Arial" font-weight="400" fill="#214233">og betalingsrelatert plattform. Treneren må også følge øvrige vilkår og retningslinjer som gjelder for funksjonene</text><text x="48" y="422" font-size="10" font-family="Arial" font-weight="400" fill="#214233">som brukes.</text><text x="48" y="446" font-size="12" font-family="Arial" font-weight="700" fill="#214233">2. Hundetimers rolle</text><text x="48" y="473" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Hundetimer tilbyr en digital plattform som gjør det mulig for kunder å finne, bestille og følge opp hundetrening,</text><text x="48" y="488" font-size="10" font-family="Arial" font-weight="400" fill="#214233">kurs, arrangementer og nettkurs.</text><text x="48" y="506" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Treneren er selv leverandør av den hundetreningen, undervisningen eller annet faglig innhold som Treneren</text><text x="48" y="521" font-size="10" font-family="Arial" font-weight="400" fill="#214233">tilbyr. Hundetimer er ikke arbeidsgiver for Treneren og inngår ikke et ansettelses-, agentur- eller</text><text x="48" y="536" font-size="10" font-family="Arial" font-weight="400" fill="#214233">partnerskapsforhold med Treneren.</text><text x="48" y="554" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Hundetimer kan legge til rette for betaling, kommunikasjon, kalender, kundehistorikk og utbetaling gjennom</text><text x="48" y="569" font-size="10" font-family="Arial" font-weight="400" fill="#214233">plattformen og eventuelle tredjepartsleverandører.</text><text x="48" y="593" font-size="12" font-family="Arial" font-weight="700" fill="#214233">3. Krav til treneren og verifisering</text><text x="48" y="620" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Treneren skal gi korrekte og oppdaterte opplysninger om identitet, virksomhet, erfaring, kvalifikasjoner, priser og</text><text x="48" y="635" font-size="10" font-family="Arial" font-weight="400" fill="#214233">tjenester.</text><text x="48" y="653" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Hundetimer kan kreve dokumentasjon før en profil godkjennes eller senere dersom det er nødvendig for</text><text x="48" y="668" font-size="10" font-family="Arial" font-weight="400" fill="#214233">sikkerhet, kvalitet eller kontroll. Godkjenning er ikke en garanti fra Hundetimer for et bestemt faglig nivå eller</text><text x="48" y="683" font-size="10" font-family="Arial" font-weight="400" fill="#214233">resultat.</text><text x="48" y="701" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Treneren er ansvarlig for nødvendige registreringer, tillatelser, forsikringer og andre krav som gjelder for egen</text><text x="48" y="716" font-size="10" font-family="Arial" font-weight="400" fill="#214233">virksomhet og aktivitet.</text><text x="48" y="812.89" font-size="8" font-family="Arial" font-weight="400" fill="#214233">Treneravtale · versjon 1.0</text><text x="517.28" y="812.89" font-size="8" font-family="Arial" font-weight="400" fill="#214233">1 / 6</text></svg>