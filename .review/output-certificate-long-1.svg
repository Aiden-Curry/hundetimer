<svg xmlns="http://www.w3.org/2000/svg" width="842" height="595" style="background:#fafaf4"><text x="105" y="82" font-size="16" font-family="Arial" font-weight="700" fill="#214233">Hundetimer</text><text x="62" y="138" font-size="11" font-family="Arial" font-weight="700" fill="#214233">KURSBEVIS</text><text x="378.507" y="175" font-size="11" font-family="Arial" font-weight="400" fill="#214233">Dette bekrefter at</text><text x="77.08000000000004" y="209" font-size="30" font-family="Times New Roman" font-weight="700" fill="#214233">Andrea Anne Marie Østgård og familien fra Hønefoss</text><text x="277.045" y="245" font-size="30" font-family="Times New Roman" font-weight="700" fill="#214233">med et langt etternavn</text><text x="396.492" y="277" font-size="11" font-family="Arial" font-weight="400" fill="#214233">har fullført</text><text x="93.05450000000002" y="308" font-size="23" font-family="Arial" font-weight="700" fill="#214233">Hverdagslydighet og trygghet sammen: et omfattende kurs i</text><text x="108.76350000000002" y="335.6" font-size="23" font-family="Arial" font-weight="700" fill="#214233">kontakt, innkalling, passering og ro for hunder i alle aldre</text><text x="237.1515" y="388" font-size="11" font-family="Arial" font-weight="400" fill="#214233">Har gjennomført alle leksjoner og øvelser i kurset sammen med hunden sin.</text><text x="350.64" y="424" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Gjennomført med Luna Østgård</text><text x="369.835" y="468" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Fullført 1. oktober 2026</text><text x="266.4445" y="487" font-size="11" font-family="Arial" font-weight="700" fill="#214233">Instruktør: Hundetrening og atferdsveiledning på Østlandet</text><text x="322.508" y="516" font-size="8" font-family="Arial" font-weight="400" fill="#214233">Kursbevis-ID: c9dce35a-c668-44d1-91ac-d9a81abcfcc1</text><text x="294.89824999999996" y="536" font-size="8.5" font-family="Arial" font-weight="400" fill="#214233">hundetimer.no/certificate/c9dce35a-c668-44d1-91ac-d9a81abcfcc1</text></svg>