<svg xmlns="http://www.w3.org/2000/svg" width="595.28" height="841.89" style="background:#fafaf4"><text x="85" y="58" font-size="15" font-family="Arial" font-weight="700" fill="#214233">Hundetimer</text><text x="48" y="119" font-size="12" font-family="Arial" font-weight="700" fill="#214233">14. Drift og tredjepartstjenester</text><text x="48" y="146" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Hundetimer arbeider for stabil drift, men garanterer ikke uavbrutt eller feilfri tilgang til plattformen.</text><text x="48" y="161" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Tilgjengeligheten kan påvirkes av vedlikehold, sikkerhetstiltak og feil hos underleverandører.</text><text x="48" y="179" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Enkelte funksjoner kan avhenge av tredjepartsleverandører for blant annet betaling, e-post, kalender, hosting og</text><text x="48" y="194" font-size="10" font-family="Arial" font-weight="400" fill="#214233">datalagring.</text><text x="48" y="218" font-size="12" font-family="Arial" font-weight="700" fill="#214233">15. Suspensjon og avtalens opphør</text><text x="48" y="245" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Treneren kan anmode om at avtaleforholdet avsluttes. Før kontoen slettes eller stenges endelig, skal aktive</text><text x="48" y="260" font-size="10" font-family="Arial" font-weight="400" fill="#214233">bestillinger, kundetilganger, refusjoner og utestående utbetalinger håndteres.</text><text x="48" y="278" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Hundetimer kan suspendere eller avslutte tilgangen ved vesentlig eller gjentatt avtalebrudd, svindel, alvorlige</text><text x="48" y="293" font-size="10" font-family="Arial" font-weight="400" fill="#214233">sikkerhetsproblemer, manglende lovpålagte opplysninger eller annen bruk som kan skade kunder, dyr,</text><text x="48" y="308" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Hundetimer eller andre brukere.</text><text x="48" y="326" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Avtalens opphør fritar ikke partene fra allerede oppståtte forpliktelser. Dette omfatter blant annet gjennomføring</text><text x="48" y="341" font-size="10" font-family="Arial" font-weight="400" fill="#214233">eller avvikling av eksisterende bestillinger, refusjoner, utbetalinger, kunders tilgang til kjøpt innhold og</text><text x="48" y="356" font-size="10" font-family="Arial" font-weight="400" fill="#214233">nødvendige dokumentasjonsplikter.</text><text x="48" y="380" font-size="12" font-family="Arial" font-weight="700" fill="#214233">16. Ansvar</text><text x="48" y="407" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Hver part er ansvarlig for egne handlinger, egne forpliktelser og tap som etter alminnelige regler kan tilskrives</text><text x="48" y="422" font-size="10" font-family="Arial" font-weight="400" fill="#214233">parten.</text><text x="48" y="440" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Hundetimer er ikke ansvarlig for den faglige utførelsen eller resultatet av Trenerens tjenester. Avtalen begrenser</text><text x="48" y="455" font-size="10" font-family="Arial" font-weight="400" fill="#214233">ikke ansvar som ikke lovlig kan begrenses.</text><text x="48" y="479" font-size="12" font-family="Arial" font-weight="700" fill="#214233">17. Endringer i avtalen</text><text x="48" y="506" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Hundetimer kan endre avtalen som følge av endringer i plattformen, forretningsmodellen eller gjeldende</text><text x="48" y="521" font-size="10" font-family="Arial" font-weight="400" fill="#214233">regelverk. Vesentlige endringer skal varsles før de får virkning for Treneren.</text><text x="48" y="539" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Dersom en ny avtaleversjon krever fornyet aksept, kan fortsatt bruk av enkelte funksjoner gjøres betinget av at</text><text x="48" y="554" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Treneren aksepterer den nye versjonen.</text><text x="48" y="578" font-size="12" font-family="Arial" font-weight="700" fill="#214233">18. Lovvalg og tvister</text><text x="48" y="605" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Avtalen reguleres av norsk rett.</text><text x="48" y="623" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Partene skal søke å løse tvister ved forhandlinger. Henvendelser til Hundetimer rettes til hei@hundetimer.no.</text><text x="48" y="638" font-size="10" font-family="Arial" font-weight="400" fill="#214233">Dersom partene ikke oppnår enighet, kan tvisten bringes inn for ordinære norske domstoler etter gjeldende</text><text x="48" y="653" font-size="10" font-family="Arial" font-weight="400" fill="#214233">regler.</text><text x="48" y="677" font-size="10" font-family="Arial" font-weight="400" fill="#214233">LangtAvsnittUtenMellomromLangtAvsnittUtenMellomromLangtAvsnittUtenMellomromLangtAvsnittUtenMellomro</text><text x="48" y="692" font-size="10" font-family="Arial" font-weight="400" fill="#214233">mLangtAvsnittUtenMellomromLangtAvsnittUtenMellomromLangtAvsnittUtenMellomromLangtAvsnittUtenMellomr</text><text x="48" y="707" font-size="10" font-family="Arial" font-weight="400" fill="#214233">omLangtAvsnittUtenMellomromLangtAvsnittUtenMellomromLangtAvsnittUtenMellomromLangtAvsnittUtenMellom</text><text x="48" y="722" font-size="10" font-family="Arial" font-weight="400" fill="#214233">romLangtAvsnittUtenMellomromLangtAvsnittUtenMellomromLangtAvsnittUtenMellomromLangtAvsnittUtenMello</text><text x="48" y="737" font-size="10" font-family="Arial" font-weight="400" fill="#214233">mromLangtAvsnittUtenMellomromLangtAvsnittUtenMellomromLangtAvsnittUtenMellomromLangtAvsnittUtenMell</text><text x="48" y="752" font-size="10" font-family="Arial" font-weight="400" fill="#214233">omromLangtAvsnittUtenMellomromLangtAvsnittUtenMellomromLangtAvsnittUtenMellomromLangtAvsnittUtenMel</text><text x="48" y="812.89" font-size="8" font-family="Arial" font-weight="400" fill="#214233">Hundetimer · Treneravtale</text><text x="517.28" y="812.89" font-size="8" font-family="Arial" font-weight="400" fill="#214233">4 / 5</text></svg>